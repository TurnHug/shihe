services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shihe
      POSTGRES_PASSWORD: shihe
      POSTGRES_DB: shihe
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - shihe-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shihe -d shihe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shihe-pgdata:
